<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚡ HARRY POTTER คณิตเวทมนตร์</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --midnight:#05030f;--deep:#0a0520;--purple:#4a1a8a;--purple2:#7c3aed;
  --gold:#f0c040;--gold2:#ffe080;--sky:#7dd3fc;--teal:#22d3ee;
  --red:#f87171;--green:#4ade80;--card:rgba(255,255,255,.06);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;
  background:var(--midnight);
  font-family:'Noto Serif Thai','Helvetica Neue',sans-serif;}

/* ── BG ── */
.bg{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#030012 0%,#0d0526 55%,#060118 100%);}
.star{position:absolute;background:#fff;border-radius:50%;
  animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}
.magic-orb{position:absolute;border-radius:50%;filter:blur(60px);
  animation:orbFloat 8s ease-in-out infinite;pointer-events:none;}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1);opacity:.35}
  50%{transform:translateY(-20px) scale(1.1);opacity:.55}}
.lightning{position:absolute;font-size:1.2rem;opacity:.18;
  animation:flash 4s ease-in-out infinite;}
@keyframes flash{0%,90%,100%{opacity:.18}95%{opacity:.7}}

/* ── SCREENS ── */
.sc{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;overflow:hidden;}
.sc.on{display:flex;}

/* ── WELCOME ── */
#sw{align-items:center;justify-content:center;gap:0;}
.logo-wrap{text-align:center;padding:10px 0 6px;}
.hp-logo{font-family:'Cinzel',serif;font-size:clamp(1.6rem,5.5vw,2.8rem);font-weight:900;
  color:var(--gold);letter-spacing:2px;line-height:1.2;
  text-shadow:0 0 30px rgba(240,192,64,.9),0 0 60px rgba(124,58,237,.5),3px 3px 0 #2a0060;
  animation:glow 2.5s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(240,192,64,.8),3px 3px 0 #2a0060}
  50%{text-shadow:0 0 60px rgba(240,192,64,1),0 0 80px rgba(124,58,237,.7),3px 3px 0 #2a0060}}
.logo-sub{color:var(--sky);font-size:clamp(.8rem,2.5vw,1rem);margin:5px 0 0;letter-spacing:1px;}
.wand-deco{font-size:3rem;animation:wandBob 3s ease-in-out infinite;margin:6px 0;}
@keyframes wandBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}

.wcard{background:rgba(10,5,32,.8);border:2px solid rgba(124,58,237,.45);
  border-radius:20px;padding:22px 26px;width:min(380px,92vw);
  backdrop-filter:blur(14px);box-shadow:0 0 50px rgba(124,58,237,.25);}
.wcard label{color:#c4b5fd;font-size:.9rem;display:block;margin-bottom:6px;}
.wcard input{width:100%;padding:12px 14px;background:rgba(255,255,255,.08);
  border:2px solid rgba(124,58,237,.4);border-radius:10px;color:#fff;
  font-size:1.1rem;outline:none;margin-bottom:14px;font-family:inherit;
  transition:border-color .2s;}
.wcard input:focus{border-color:var(--gold);}
.btn-p{display:block;width:100%;padding:14px;
  background:linear-gradient(135deg,#7c3aed,#4a1a8a);
  border:none;border-radius:12px;color:#fff;font-size:1.1rem;font-weight:700;
  cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.5);font-family:inherit;
  transition:all .15s;margin-bottom:10px;}
.btn-p:active{transform:scale(.97);box-shadow:none;}
.btn-p.gold{background:linear-gradient(135deg,#d97706,#f0c040);color:#1a0800;
  box-shadow:0 4px 18px rgba(240,192,64,.4);}
.btn-s{display:block;width:100%;padding:12px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.22);
  border-radius:12px;color:#c4b5fd;font-size:1rem;cursor:pointer;font-family:inherit;
  transition:all .15s;}
.btn-s:active{background:rgba(255,255,255,.15);}

/* ── MAP ── */
#sm{background:transparent;}
.mhdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(0,0,0,.55);border-bottom:1px solid rgba(124,58,237,.3);}
.mhdr-title{flex:1;color:var(--gold);font-weight:700;font-size:1rem;text-align:center;
  font-family:'Cinzel',serif;}
.mhdr-player{color:var(--sky);font-size:.85rem;}
.map-list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:11px;}
.isl{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);
  border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.isl.unlocked{border-color:rgba(124,58,237,.5);}
.isl.done{border-color:rgba(240,192,64,.5);background:rgba(240,192,64,.06);}
.isl.locked{opacity:.4;cursor:not-allowed;}
.isl:not(.locked):active{transform:scale(.98);}
.isl-icon{font-size:2rem;min-width:44px;text-align:center;}
.isl-info{flex:1;}
.isl-name{color:#fff;font-size:.95rem;font-weight:700;margin-bottom:3px;}
.isl-sub{color:#c4b5fd;font-size:.78rem;}
.isl-stars{font-size:.9rem;margin-top:3px;}
.isl-arrow{font-size:1.2rem;color:var(--gold);}

/* ── STORY ── */
.shdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(0,0,0,.65);border-bottom:1px solid rgba(124,58,237,.25);}
.story-wrap{flex:1;display:flex;flex-direction:column;
  max-width:720px;width:100%;margin:0 auto;padding:14px 16px 12px;}
.story-icon{font-size:2.5rem;text-align:center;margin-bottom:6px;}
.story-title{color:var(--gold);font-size:clamp(1.05rem,3.5vw,1.45rem);font-weight:900;
  font-family:'Cinzel',serif;
  text-align:center;margin-bottom:10px;text-shadow:0 0 15px rgba(240,192,64,.5);}
.story-body{flex:1;overflow-y:auto;color:#e0d4f7;
  font-size:clamp(1rem,2.8vw,1.1rem);line-height:1.9;
  background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.2);border-radius:12px;
  padding:14px 18px;margin-bottom:14px;}
.story-body strong{color:var(--gold2);}
.btn-mission{align-self:center;padding:13px 34px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  border:none;border-radius:12px;color:#fff;font-size:1.05rem;font-weight:700;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 16px rgba(124,58,237,.55);transition:all .15s;}
.btn-mission:active{transform:scale(.97);}

/* ── GAME ── */
.ghdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:rgba(0,0,0,.6);
  border-bottom:1px solid rgba(124,58,237,.2);flex-shrink:0;}
.g-hearts{font-size:1.15rem;letter-spacing:1px;}
.g-ch{color:var(--gold);font-size:.82rem;font-weight:700;text-align:center;
  font-family:'Cinzel',serif;}
.g-qcount{font-size:.72rem;color:#999;text-align:center;}
.g-score-total{color:var(--gold);font-size:1.15rem;font-weight:900;
  text-shadow:0 0 12px rgba(240,192,64,.7);}
.g-score-ch{color:#c4b5fd;font-size:.72rem;margin-top:1px;}
.g-btns{display:flex;gap:6px;margin-top:2px;justify-content:flex-end;}

.prog{height:4px;background:rgba(255,255,255,.1);flex-shrink:0;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--purple2),var(--gold));transition:width .35s ease;}

.q-area{padding:12px 16px 8px;background:rgba(0,0,0,.35);flex-shrink:0;}
.q-text{color:#f0e8ff;font-size:clamp(1.05rem,3.2vw,1.3rem);font-weight:600;
  line-height:1.75;text-align:center;}

/* ── SCRATCH PAD ── */
.scratch-zone{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 12px 4px;}
.scratch-bar{display:flex;align-items:center;gap:6px;padding:0 2px;margin-bottom:5px;flex-shrink:0;flex-wrap:nowrap;}
.scratch-lbl{color:#999;font-size:.72rem;white-space:nowrap;flex-shrink:0;}
.cb{width:20px;height:20px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .2s;flex-shrink:0;}
.cb.on{border-color:#fff;transform:scale(1.25);}
.clr-btn{padding:4px 10px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#ccc;font-size:.75rem;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.clr-btn.on{background:rgba(240,192,64,.3);border-color:rgba(240,192,64,.8);color:var(--gold);}
.clr-btns{margin-left:auto;display:flex;gap:5px;flex-shrink:0;}
#scratch{flex:1;min-height:0;
  background:rgba(255,255,255,.05);border:1.5px dashed rgba(124,58,237,.3);
  border-radius:10px;cursor:crosshair;touch-action:none;display:block;width:100%;}

/* ── ANSWERS ── */
.ans-area{padding:8px 12px 10px;background:rgba(0,0,0,.4);
  border-top:1px solid rgba(124,58,237,.15);flex-shrink:0;}
.ch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ch-btn{padding:14px 8px;background:rgba(124,58,237,.1);
  border:2px solid rgba(124,58,237,.3);border-radius:10px;
  color:#f0e8ff;font-size:clamp(1rem,3.2vw,1.2rem);font-weight:700;
  cursor:pointer;transition:all .15s;text-align:center;font-family:inherit;}
.ch-btn:active:not(:disabled){transform:scale(.96);}
.ch-btn.sel{background:rgba(240,192,64,.2);border-color:var(--gold);color:var(--gold);}
.ch-btn.ok{background:rgba(74,222,128,.2);border-color:var(--green);color:#86efac;}
.ch-btn.bad{background:rgba(248,113,113,.18);border-color:var(--red);color:#fca5a5;}
.ch-btn:disabled{opacity:.7;cursor:default;}
.cfm-btn{width:100%;padding:14px;border:none;border-radius:11px;
  color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .15s;}
.cfm-btn:disabled{background:rgba(255,255,255,.08);color:#555;cursor:default;}
.cfm-idle{background:linear-gradient(135deg,#7c3aed,#4a1a8a);}
.cfm-next{background:linear-gradient(135deg,#d97706,#f0c040);color:#1a0800;}
.cfm-btn:not(:disabled):active{transform:scale(.97);}

/* ── SOLUTION BOX ── */
#solBox{display:none;margin:6px 0 0;padding:10px 14px;
  background:rgba(20,10,50,.9);border:1.5px solid rgba(124,58,237,.4);
  border-radius:10px;font-size:.82rem;color:#c4b5fd;line-height:1.7;}
#solBox.show{display:block;}
#solBox .sol-title{color:var(--gold2);font-weight:700;font-size:.88rem;margin-bottom:4px;}
#solBox .sol-step{font-family:monospace;font-size:.85rem;color:#a8d8ff;white-space:pre-wrap;}
#solBox .sol-ans{color:#86efac;font-weight:700;margin-top:4px;}

/* ── FEEDBACK ── */
#fb{position:fixed;inset:0;z-index:200;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
#fb.on{opacity:1;}
.fb-ico{font-size:5rem;animation:pop .4s ease-out;}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}

/* ── CHAPTER COMPLETE ── */
#scc{align-items:center;justify-content:center;background:rgba(0,0,0,.85);}
.cc-card{background:linear-gradient(135deg,#0f0535,#1a0850);
  border:3px solid var(--gold);border-radius:22px;
  padding:30px 34px;text-align:center;width:min(360px,90vw);
  box-shadow:0 0 60px rgba(124,58,237,.3);}
.cc-title{color:var(--gold);font-size:1.7rem;font-weight:900;margin-bottom:6px;
  font-family:'Cinzel',serif;}
.cc-stars{font-size:2.3rem;letter-spacing:6px;margin:12px 0;}
.cc-score{color:var(--sky);font-size:1.05rem;margin-bottom:8px;}
.cc-score span{color:#fff;font-weight:700;font-size:1.3rem;}
.cc-msg{color:#c4b5fd;font-size:.9rem;margin-bottom:22px;}

/* ── VICTORY ── */
#sv{align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
.vic-card{background:linear-gradient(135deg,#0f0535,#1a0850);
  border:3px solid var(--gold);border-radius:22px;
  padding:30px 26px;text-align:center;width:min(400px,92vw);}
.vic-ico{font-size:3.5rem;margin-bottom:8px;}
.vic-title{color:var(--gold);font-size:clamp(1.4rem,5vw,2rem);font-weight:900;margin-bottom:6px;
  font-family:'Cinzel',serif;}
.vic-sub{color:var(--sky);font-size:.95rem;margin-bottom:16px;}
.vic-score{color:#fff;font-size:1.4rem;margin-bottom:8px;}

/* ── LEADERBOARD ── */
#slb{overflow-y:auto;}
.lb-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:rgba(0,0,0,.6);border-bottom:1px solid rgba(124,58,237,.25);flex-shrink:0;}
.lb-hdr-t{flex:1;color:var(--gold);font-weight:700;text-align:center;font-family:'Cinzel',serif;}
.lb-body{max-width:600px;margin:0 auto;padding:18px 14px;}
.lb-row{display:flex;align-items:center;padding:12px 16px;border-radius:11px;
  margin-bottom:8px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);}
.lb-row.me{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.5);}
.lb-rank{color:var(--gold);font-weight:700;width:36px;font-size:1rem;}
.lb-name{flex:1;color:#fff;font-size:.93rem;}
.lb-sc{color:var(--sky);font-weight:700;font-size:.95rem;}
.lb-dt{color:#777;font-size:.75rem;margin-left:8px;}
.lb-empty{color:#888;text-align:center;padding:40px 20px;font-size:.95rem;}

/* ── SHARED ── */
.bk{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);
  border-radius:8px;color:#c4b5fd;font-size:.88rem;padding:6px 12px;cursor:pointer;transition:all .15s;}
.bk:active{background:rgba(255,255,255,.2);}
.mu{background:transparent;border:none;font-size:1.1rem;cursor:pointer;padding:4px;}

/* ── PARTICLES ── */
.ptcl{position:fixed;z-index:999;pointer-events:none;font-size:1.4rem;
  animation:fly 1.1s ease-out forwards;}
@keyframes fly{0%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(-120px) scale(.3);opacity:0}}

/* ── SAVE INFO ── */
.save-info{display:none;margin:-4px 0 12px;padding:10px 14px;
  background:rgba(74,222,128,.1);border:1.5px solid rgba(74,222,128,.4);
  border-radius:10px;color:#86efac;font-size:.82rem;line-height:1.6;text-align:center;}
.save-info strong{color:#a7f3d0;}
.btn-reset{display:block;width:100%;padding:10px;margin-bottom:10px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,100,100,.35);
  border-radius:10px;color:#ff9090;font-size:.88rem;cursor:pointer;
  font-family:inherit;transition:all .15s;}
.btn-reset:active{background:rgba(255,100,100,.15);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.4);border-radius:2px;}
</style>
</head>
<body>
<!-- BG -->
<div class="bg">
  <div id="stars"></div>
  <div class="magic-orb" style="width:300px;height:300px;background:radial-gradient(#4a1a8a,transparent);top:10%;left:-5%;animation-delay:0s"></div>
  <div class="magic-orb" style="width:250px;height:250px;background:radial-gradient(#1a0550,transparent);top:50%;right:-5%;animation-delay:3s"></div>
  <div class="magic-orb" style="width:200px;height:200px;background:radial-gradient(#3b0764,transparent);bottom:5%;left:30%;animation-delay:5s"></div>
</div>

<!-- WELCOME -->
<div class="sc" id="sw">
  <div class="logo-wrap">
    <div class="wand-deco">⚡🦉✨</div>
    <div class="hp-logo">HARRY POTTER<br>คณิตเวทมนตร์</div>
    <div class="logo-sub">✨ 7 ปีแห่งการผจญภัยที่ฮอกวอตส์ ✨</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px;">
    <div class="wcard">
      <label>🪄 ชื่อนักเวทย์</label>
      <input id="inp" type="text" placeholder="พิมพ์ชื่อของเธอ..." autocomplete="off" maxlength="20"/>
      <div class="save-info" id="saveInfo"></div>
      <button class="btn-p" id="btnStart" onclick="startGame()">⚡ เริ่มการผจญภัย!</button>
      <button class="btn-reset" id="btnReset" style="display:none;" onclick="resetAndStart()">🔄 ล้างข้อมูลเก่า แล้วเริ่มใหม่</button>
      <button class="btn-s" onclick="show('slb')">🏆 ดูตาราง Ranking</button>
    </div>
  </div>
</div>

<!-- MAP -->
<div class="sc" id="sm">
  <div class="mhdr">
    <button class="bk" onclick="switchPlayer()">🔄 เปลี่ยนผู้เล่น</button>
    <div class="mhdr-title">🗺️ แผนที่ฮอกวอตส์</div>
    <div class="mhdr-player" id="mpPlayer"></div>
    <button class="mu" id="muBtn" onclick="togMusic()">🔊</button>
  </div>
  <div id="mpScore" style="text-align:center;color:var(--gold2);font-size:.82rem;padding:2px 0 4px;letter-spacing:.5px;"></div>
  <div class="map-list" id="mapList"></div>
</div>

<!-- STORY -->
<div class="sc" id="si">
  <div class="shdr">
    <button class="bk" onclick="show('sm')">← แผนที่</button>
    <div style="flex:1;color:var(--gold);font-weight:700;text-align:center;font-size:.9rem;font-family:'Cinzel',serif;">เนื้อเรื่อง</div>
  </div>
  <div class="story-wrap">
    <div class="story-icon" id="sIcon"></div>
    <div class="story-title" id="sTitle"></div>
    <div class="story-body" id="sBody"></div>
    <button class="btn-mission" onclick="startCh()">🪄 เริ่มภารกิจเวทมนตร์!</button>
  </div>
</div>

<!-- GAME -->
<div class="sc" id="sg">
  <div class="ghdr">
    <div>
      <div class="g-hearts" id="gHearts">❤️❤️❤️</div>
      <div class="g-qcount" id="gQC">ข้อ 1/10</div>
    </div>
    <div>
      <div class="g-ch" id="gCh"></div>
    </div>
    <div>
      <div>
        <div class="g-score-total">⭐ <span id="gScoreTot">0</span></div>
        <div class="g-score-ch">ด่านนี้: <span id="gScore">0</span></div>
      </div>
      <div class="g-btns">
        <button class="bk" style="font-size:.78rem;padding:4px 8px;" onclick="show('sm')">🗺️</button>
        <button class="mu" style="font-size:1rem;" onclick="togMusic()">🔊</button>
      </div>
    </div>
  </div>
  <div class="prog"><div class="prog-fill" id="gProg" style="width:0%"></div></div>

  <div class="q-area">
    <div class="q-text" id="qText">...</div>
    <div id="solBox">
      <div class="sol-title">💡 วิธีคิด</div>
      <div class="sol-step" id="solStep"></div>
      <div class="sol-ans" id="solAns"></div>
    </div>
  </div>

  <div class="scratch-zone">
    <div class="scratch-bar">
      <span class="scratch-lbl">✏️ ทดเลข</span>
      <button class="cb on" style="background:#fff" data-c="#fff" onclick="setC(this)"></button>
      <button class="cb" style="background:#c4b5fd" data-c="#c4b5fd" onclick="setC(this)"></button>
      <button class="cb" style="background:#fde68a" data-c="#fde68a" onclick="setC(this)"></button>
      <div class="clr-btns">
        <button class="clr-btn" id="eraserBtn" onclick="toggleEraser(this)">🧹 ลบ</button>
        <button class="clr-btn" onclick="clrCV()">🗑️ ล้าง</button>
      </div>
    </div>
    <canvas id="scratch"></canvas>
  </div>

  <div class="ans-area">
    <div class="ch-grid" id="chGrid"></div>
    <button class="cfm-btn" id="cfmBtn" disabled onclick="onCfm()">✓ ยืนยัน</button>
  </div>
</div>

<!-- FEEDBACK -->
<div id="fb"><div class="fb-ico" id="fbIco"></div></div>

<!-- CHAPTER COMPLETE -->
<div class="sc" id="scc">
  <div class="cc-card">
    <div style="font-size:2.5rem;">🎉</div>
    <div class="cc-title">ภารกิจสำเร็จ!</div>
    <div class="cc-stars" id="ccSt">⭐⭐⭐</div>
    <div class="cc-score">คะแนน: <span id="ccSc">0</span></div>

function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function fmt(n){return n.toLocaleString('th-TH');}

function genA(d,ci){
  const lo=Math.pow(10,d-1),hi=Math.pow(10,d)-1;
  const a=R(lo,hi-200),b=R(200,Math.min(hi-a,Math.floor(hi*.55)));
  const ans=a+b;
  const c=CH[ci].ctx;
  const ts=[
    `${c[0]}นับเหรียญ${c[5]}ในถุงแรกได้ ${fmt(a)} เหรียญ ในถุงที่สองมีอีก ${fmt(b)} เหรียญ รวมมีเหรียญทั้งหมดกี่เหรียญ?`,
    `ห้องสมุดฮอกวอตส์มีตำรา ${fmt(a)} เล่ม แฮร์ไมโอนี่สั่งซื้อเพิ่มมาอีก ${fmt(b)} เล่ม ตอนนี้มีตำราทั้งหมดกี่เล่ม?`,
    `${c[3]}มีคาถาบันทึกไว้ ${fmt(a)} บท ค้นพบคาถาโบราณเพิ่มอีก ${fmt(b)} บท มีคาถาในบันทึกรวมกี่บท?`,
    `ทัพของ${c[2]}มีพลพรรค ${fmt(a)} คน รับสมัครพันธมิตรเพิ่มอีก ${fmt(b)} คน กองทัพทั้งหมดมีกี่คน?`,
    `${c[1]}เดินทาง ${fmt(a)} ${c[7]} เมื่อวาน วันนี้เดินทางต่ออีก ${fmt(b)} ${c[7]} รวมระยะทางทั้งสองวันกี่${c[7]}?`,
    `ปีการศึกษาที่แล้วมีนักเรียน ${fmt(a)} คน ปีนี้มีนักเรียนใหม่เพิ่ม ${fmt(b)} คน ฮอกวอตส์มีนักเรียนรวมกี่คน?`,
  ];
  return {text:ts[R(0,ts.length-1)],ans,_a:a,_b:b,_op:'add'};
}

function genS(d,ci){
  const lo=Math.pow(10,d-1),hi=Math.pow(10,d)-1;
  const a=R(lo+500,hi),b=R(200,Math.min(a-100,Math.floor(a*.5)));
  const ans=a-b;
  const c=CH[ci].ctx;
  const ts=[
    `คลังของ${c[0]}มีแร่โบราณ ${fmt(a)} ${c[6]} ใช้ปรุงยาไป ${fmt(b)} ${c[6]} เหลือแร่โบราณในคลังกี่${c[6]}?`,
    `กองทัพฮอกวอตส์มีพลเวทย์ ${fmt(a)} คน ถูกคาถาสลบไป ${fmt(b)} คน ยังพร้อมรบอยู่กี่คน?`,
    `${c[1]}เริ่มเดินทาง ${fmt(a)} ${c[7]} เดินไปแล้ว ${fmt(b)} ${c[7]} ยังเหลือระยะทางอีกกี่${c[7]}?`,
    `คลัง${c[5]}ในโกรงกรางมี ${fmt(a)} ${c[5]} ${c[0]}ถอนเงินออกมา ${fmt(b)} ${c[5]} เหลือในคลังกี่${c[5]}?`,
    `ตำราคาถาโบราณมีทั้งหมด ${fmt(a)} หน้า ${c[1]}อ่านไปแล้ว ${fmt(b)} หน้า เหลืออีกกี่หน้า?`,
    `${c[3]}มีห้องลับทั้งหมด ${fmt(a)} ห้อง สำรวจไปแล้ว ${fmt(b)} ห้อง ยังไม่ได้สำรวจอีกกี่ห้อง?`,
  ];
  return {text:ts[R(0,ts.length-1)],ans,_a:a,_b:b,_op:'sub'};
}

function genM(tier,ci){
  let a,b;
  if(tier===1){a=R(100,999);b=R(2,9);}
  else if(tier===2){a=R(100,999);b=R(11,49);}
  else if(tier===3){a=R(1000,9999);b=R(2,9);}
  else{a=R(100,999);b=R(12,59);}
  const ans=a*b;
  const c=CH[ci].ctx;
  const ts=[
    `นักเรียนฮอกวอตส์ ${fmt(b)} คน แต่ละคนต้องซื้อตำรา${c[9]} ราคาเล่มละ ${fmt(a)} ${c[5]} รวมค่าตำราทั้งหมดกี่${c[5]}?`,
    `${c[0]}ฝึกคาถา ${fmt(a)} ครั้งต่อวัน ฝึกติดต่อกัน ${fmt(b)} วัน รวมฝึกไปทั้งหมดกี่ครั้ง?`,
    `ห้องใต้ดินมีหม้อยา ${fmt(b)} ใบ แต่ละใบบรรจุส่วนผสม ${fmt(a)} ${c[6]} รวมส่วนผสมทั้งหมดกี่${c[6]}?`,
    `ตู้หนังสือ ${fmt(b)} ตู้ แต่ละตู้มีตำราเวทมนตร์ ${fmt(a)} เล่ม มีตำรารวมทั้งหมดกี่เล่ม?`,
    `กองทัพนักเวทย์แบ่งออกเป็น ${fmt(b)} กลุ่ม แต่ละกลุ่มมีสมาชิก ${fmt(a)} คน รวมทั้งหมดกี่คน?`,
    `${c[1]}วิ่งได้ ${fmt(a)} เมตรต่อนาที วิ่งนาน ${fmt(b)} นาทีไม่หยุด รวมระยะทางกี่เมตร?`,
  ];
  return {text:ts[R(0,ts.length-1)],ans,_a:a,_b:b,_op:'mul'};
}

function genD(tier,ci){
  const divisor=R(2,9);
  const quot=tier===1?R(100,999):R(1000,4999);
  const dividend=divisor*quot;
  const c=CH[ci].ctx;
  const ts=[
    `${c[0]}แบ่งส่วนผสมยา ${fmt(dividend)} ${c[6]} ออกเป็น ${divisor} หม้อเท่าๆ กัน หม้อละกี่${c[6]}?`,
    `นักเรียน ${fmt(dividend)} คน แบ่งเป็น ${divisor} หอพัก หอพักละเท่ากัน หอพักละกี่คน?`,
    `${c[5]} ${fmt(dividend)} ${c[5]} แจกให้ผู้ชนะ ${divisor} คน เท่าๆ กัน คนละกี่${c[5]}?`,
    `ยาวิเศษ ${fmt(dividend)} ${c[6]} แบ่งเป็น ${divisor} ขวดเท่ากัน ขวดละกี่${c[6]}?`,
    `ตำราเวทมนตร์ ${fmt(dividend)} เล่ม เรียงลงชั้น ${divisor} ชั้นเท่าๆ กัน ชั้นละกี่เล่ม?`,
  ];
  return {text:ts[R(0,ts.length-1)],ans:quot,_a:dividend,_b:divisor,_op:'div'};
}

const QF={
  a3:(ci)=>genA(3,ci),a4:(ci)=>genA(4,ci),a5:(ci)=>genA(5,ci),
  s3:(ci)=>genS(3,ci),s4:(ci)=>genS(4,ci),s5:(ci)=>genS(5,ci),
  m1:(ci)=>genM(1,ci),m2:(ci)=>genM(2,ci),m3:(ci)=>genM(3,ci),m4:(ci)=>genM(4,ci),
  d1:(ci)=>genD(1,ci),d2:(ci)=>genD(2,ci)
};

function makeQs(ci){
  return CH[ci].qt.map(t=>{
    const q=(QF[t]||QF.a3)(ci);
    return {...q,choices:makeChoices(q)};
  });
}

function makeChoices(q){
  const ans=q.ans,a=q._a,b=q._b,op=q._op;
  const s=new Set([ans]);
  const traps=[];
  if(op==='add'){
    traps.push(ans-10,ans-100,ans-1000,ans+10,ans+100,ans+1,ans-1,ans+9,ans-9);
    if(a-b>0) traps.push(a-b);
  } else if(op==='sub'){
    traps.push(ans+10,ans+100,ans+1000,ans-10,ans-100,a+b,ans+1,ans-1);
    if(b<a) traps.push(b);
  } else if(op==='mul'){
    traps.push(a*(b-1),a*(b+1));
    if(b>=10) traps.push(a*Math.floor(b/10)+a*(b%10));
    traps.push(a*(b%10||1),ans-a,ans+a);
  } else if(op==='div'){
    traps.push(ans+1,ans-1,b,ans+b,a*b);
    if(ans-b>0) traps.push(ans-b);
  }
  for(const t of traps){
    const v=Math.round(t);
    if(v>0&&v!==ans&&s.size<4) s.add(v);
  }
  const range=Math.max(20,Math.floor(ans*.12));
  let attempts=0;
  while(s.size<4&&attempts++<300){
    const w=ans+R(-range,range);
    if(w>0&&w!==ans) s.add(w);
  }
  const arr=[...s];
  for(let i=arr.length-1;i>0;i--){const j=R(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

const SAVE_PREFIX='hp_math_save_';

async function saveProgress(){
  if(!G.name) return;
  const data={
    name:G.name,totSc:G.totSc,
    done:[...G.done],stars:[...G.stars],bestSc:[...G.bestSc],
    savedAt:Date.now(),
    savedAtStr:new Date().toLocaleDateString('th-TH')
  };
  // 1) localStorage (primary)
  try{ localStorage.setItem(SAVE_PREFIX+G.name,JSON.stringify(data)); }catch(_){}
  // 2) Firebase (backup)
  if(typeof db!=='undefined'&&db){
    try{ await db.collection('hp_saves').doc(G.name).set(data); }catch(_){}
  }
}

async function loadSave(name){
  // localStorage ก่อนเสมอ
  try{
    const ls=localStorage.getItem(SAVE_PREFIX+name);
    if(ls){const d=JSON.parse(ls);if(d&&d.name) return d;}
  }catch(_){}
  // Firebase fallback
  if(typeof db!=='undefined'&&db){
    try{
      const snap=await db.collection('hp_saves').doc(name).get();
      if(snap.exists){const d=snap.data();if(d&&d.name) return d;}
    }catch(_){}
  }
  return null;
}

async function deleteSave(name){
  try{ localStorage.removeItem(SAVE_PREFIX+name); }catch(_){}
  if(typeof db!=='undefined'&&db){
    try{ await db.collection('hp_saves').doc(name).delete(); }catch(_){}
  }
}

function applySave(data){
  G.name=data.name;
  G.totSc=data.totSc||0;
  G.done=[...(data.done||Array(7).fill(false))];
  G.stars=[...(data.stars||Array(7).fill(0))];
  G.bestSc=[...(data.bestSc||Array(7).fill(0))];
  G.ch=0;G.qi=0;G.hp=3;G.chSc=0;
}

function renderQ(){
  const q=G.qs[G.qi];
  G.sel=null;G.phase='idle';
  document.getElementById('solBox').classList.remove('show');
  document.getElementById('gHearts').textContent='❤️'.repeat(G.hp)+'🖤'.repeat(3-G.hp);
  document.getElementById('gQC').textContent=`ข้อ ${G.qi+1}/${G.qs.length}`;
  document.getElementById('gScore').textContent=G.chSc;
  document.getElementById('gProg').style.width=(G.qi/G.qs.length*100)+'%';
  document.getElementById('qText').textContent=q.text;

  const grid=document.getElementById('chGrid');
  grid.innerHTML='';
  q.choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='ch-btn';
    b.textContent=fmt(c);
    b.onclick=()=>selCh(b,c);
    grid.appendChild(b);
  });
  setCfm('idle');
}

function selCh(btn,val){
  if(G.phase==='ans') return;
  document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  G.sel=val;G.phase='sel';
  setCfm('sel');
}

function setCfm(st){
  const b=document.getElementById('cfmBtn');
  if(st==='idle'){b.disabled=true;b.textContent='✓ ยืนยัน';b.className='cfm-btn';}
  else if(st==='sel'){b.disabled=false;b.textContent='✓ ยืนยัน';b.className='cfm-btn cfm-idle';}
  else if(st==='next'){b.disabled=false;b.textContent=G.qi<G.qs.length-1?'→ ข้อต่อไป':'🏆 สรุปผล';b.className='cfm-btn cfm-next';}
}

function onCfm(){
  if(G.phase==='ans'){
    G.qi++;
    if(G.qi>=G.qs.length) endCh();
    else renderQ();
    return;
  }
  if(G.phase!=='sel') return;
  G.phase='ans';
  const q=G.qs[G.qi];
  const ok=G.sel===q.ans;
  document.querySelectorAll('.ch-btn').forEach(b=>{
    b.disabled=true;
    const v=parseInt(b.textContent.replace(/[,\s]/g,''));
    if(v===q.ans) b.classList.add('ok');
    else if(v===G.sel) b.classList.add('bad');
  });
  if(ok){
    G.chSc+=10;
    if(G.chSc>G.bestSc[G.ch]) G.bestSc[G.ch]=G.chSc;
    G.totSc=G.bestSc.reduce((s,v)=>s+v,0);
    document.getElementById('gScore').textContent=G.chSc;
    document.getElementById('gScoreTot').textContent=G.totSc;
    const el=document.getElementById('gScoreTot');
    el.style.transform='scale(1.4)';el.style.transition='transform .15s';
    setTimeout(()=>{el.style.transform='scale(1)';},150);
    showFB('✨');ptcl(['⭐','🌟','✨','⚡','🪄'],6);playSnd('ok');
  } else {
    G.hp--;
    document.getElementById('gHearts').textContent='❤️'.repeat(G.hp)+'🖤'.repeat(3-G.hp);
    showFB('💔');playSnd('bad');
    showSolution(q);
    if(G.hp<=0){setTimeout(()=>{
      if(confirm('พลังงานหมดแล้ว! 😅\nลองใหม่อีกครั้ง?')) startCh();
      else show('sm');
    },1200);return;}
  }
  setCfm('next');
}

function endCh(){
  const tot=G.qs.length*10,pct=G.chSc/tot;
  const st=pct>=.9?3:pct>=.6?2:1;
  G.done[G.ch]=true;
  G.stars[G.ch]=Math.max(G.stars[G.ch],st);
  if(G.chSc>G.bestSc[G.ch]) G.bestSc[G.ch]=G.chSc;
  G.totSc=G.bestSc.reduce((s,v)=>s+v,0);
  document.getElementById('ccSt').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  document.getElementById('ccSc').innerHTML=`<span>${G.chSc}</span> / ${tot}`;
  const msgs=['ดีมาก! ลองทำให้ได้คะแนนเต็มนะ! 💪','เก่งมาก! เกือบเต็มแล้ว 😊','ยอดเยี่ยม! Wingardium Leviosa! 🌟'];
  document.getElementById('ccMsg').textContent=msgs[st-1];
  ptcl(['🎉','⭐','🪄','⚡'],8);
  saveScore();
  saveProgress();
  if(G.ch===6){
    setTimeout(()=>{document.getElementById('vSc').textContent=G.totSc;show('sv');},600);
  } else {
    show('scc');
  }
  renderMap();
}

function showSolution(q){
  const a=q._a,b=q._b,ans=q.ans,op=q._op;
  let steps='',ansLine='';
  if(op==='add'){
    const aStr=fmt(a),bStr=fmt(b),ansStr=fmt(ans);
    const w=Math.max(aStr.length,bStr.length,ansStr.length)+2;
    steps=`  ${aStr.padStart(w)}\n+ ${bStr.padStart(w)}\n${'─'.repeat(w+2)}\n  ${ansStr.padStart(w)}`;
    ansLine=`คำตอบ: ${fmt(a)} + ${fmt(b)} = ${fmt(ans)}`;
  } else if(op==='sub'){
    const aStr=fmt(a),bStr=fmt(b),ansStr=fmt(ans);
    const w=Math.max(aStr.length,bStr.length,ansStr.length)+2;
    steps=`  ${aStr.padStart(w)}\n− ${bStr.padStart(w)}\n${'─'.repeat(w+2)}\n  ${ansStr.padStart(w)}`;
    ansLine=`คำตอบ: ${fmt(a)} − ${fmt(b)} = ${fmt(ans)}`;
  } else if(op==='mul'){
    if(b<10){
      steps=`${fmt(a)} × ${b} = ${fmt(ans)}`;
    } else {
      const b1=Math.floor(b/10),b0=b%10;
      const p0=a*b0,p1=a*b1;
      steps=`${fmt(a)} × ${b0} (หลักหน่วย) = ${fmt(p0)}\n${fmt(a)} × ${b1}0 (หลักสิบ)  = ${fmt(p1*10)}\n${'─'.repeat(22)}\n${fmt(p0)} + ${fmt(p1*10)} = ${fmt(ans)}`;
    }
    ansLine=`คำตอบ: ${fmt(a)} × ${fmt(b)} = ${fmt(ans)}`;
  } else if(op==='div'){
    steps=`${fmt(a)} ÷ ${b} = ?\n\n${b} × ${fmt(ans)} = ${fmt(a)}\nดังนั้น ${fmt(a)} ÷ ${b} = ${fmt(ans)}`;
    ansLine=`คำตอบ: ${fmt(a)} ÷ ${b} = ${fmt(ans)}`;
  }
  document.getElementById('solStep').textContent=steps;
  document.getElementById('solAns').textContent=ansLine;
  document.getElementById('solBox').classList.add('show');
}

// ══════════════════════════════════════════════
//  CANVAS SCRATCH PAD
// ══════════════════════════════════════════════
let cv,ctx,drw=false,penC='#fff',eraserMode=false;

function initCV(){
  cv=document.getElementById('scratch');
  if(!cv) return;
  const nc=cv.cloneNode(false);
  cv.parentNode.replaceChild(nc,cv);
  cv=nc;
  const dpr=window.devicePixelRatio||1;
  const rc=cv.getBoundingClientRect();
  if(!rc.width) return;
  cv.width=rc.width*dpr;
  cv.height=rc.height*dpr;
  ctx=cv.getContext('2d',{desynchronized:true});
  ctx.scale(dpr,dpr);
  ctx.lineCap='round';ctx.lineJoin='round';
  let p0={x:0,y:0},mid0={x:0,y:0};

  function getXY(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pr:e.pressure||0};}
  function applyStyle(pressure,isPen){
    if(eraserMode){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.lineWidth=isPen?(pressure>0?Math.max(12,pressure*28):14):18;}
    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=penC;ctx.lineWidth=isPen?(pressure>0?Math.max(1,pressure*3.5):2):2.5;}
  }
  function drawSmooth(x,y,pressure,isPen){
    const mid1={x:(p0.x+x)/2,y:(p0.y+y)/2};
    applyStyle(pressure,isPen);
    ctx.beginPath();ctx.moveTo(mid0.x,mid0.y);
    ctx.quadraticCurveTo(p0.x,p0.y,mid1.x,mid1.y);ctx.stroke();
    mid0=mid1;p0={x,y};
  }
  cv.addEventListener('pointerdown',e=>{
    drw=true;cv.setPointerCapture(e.pointerId);
    const{x,y,pr}=getXY(e);p0={x,y};mid0={x,y};
    const isPen=e.pointerType==='pen';applyStyle(pr,isPen);
    ctx.beginPath();ctx.arc(x,y,ctx.lineWidth/2,0,Math.PI*2);
    ctx.fillStyle=eraserMode?'rgba(0,0,0,1)':penC;ctx.fill();
    ctx.globalCompositeOperation=eraserMode?'destination-out':'source-over';
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('pointermove',e=>{
    if(!drw) return;
    const isPen=e.pointerType==='pen';
    const coalesced=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ce of coalesced){
      const{x,y,pr}=getXY(ce);
      const dx=x-p0.x,dy=y-p0.y;
      if(dx*dx+dy*dy<0.25) continue;
      drawSmooth(x,y,pr,isPen);
    }
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('pointerup',e=>{if(!drw)return;drw=false;const{x,y,pr}=getXY(e);drawSmooth(x,y,pr,e.pointerType==='pen');},{passive:true});
  cv.addEventListener('pointercancel',()=>{drw=false;},{passive:true});
}

function toggleEraser(btn){
  eraserMode=!eraserMode;btn.classList.toggle('on',eraserMode);
  if(eraserMode){document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));}
  else{if(ctx)ctx.globalCompositeOperation='source-over';const active=document.querySelector(`.cb[data-c="${penC}"]`);if(active)active.classList.add('on');}
}
function setC(btn){
  eraserMode=false;document.getElementById('eraserBtn').classList.remove('on');
  penC=btn.dataset.c;document.querySelectorAll('.cb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  if(ctx){ctx.strokeStyle=penC;ctx.globalCompositeOperation='source-over';}
}
function clrCV(){
  if(!cv||!ctx) return;
  const dpr=window.devicePixelRatio||1;
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
}

//  MAGIC MUSIC (Hedwig's Theme inspired)
// ══════════════════════════════════════════════
let aCtx,mT;
// Hedwig's Theme approximation — E minor, mystical feel
const MEL=[
  [659,300],[null,100],[494,150],[659,300],[784,150],[740,300],[659,300],
  [988,300],[null,100],[784,150],[988,300],[1047,150],[988,600],
  [659,300],[null,100],[494,150],[659,300],[784,150],[740,300],[523,300],
  [587,600],[587,300],[null,100],[494,150],
  [523,300],[659,150],[587,300],[494,150],[440,600],
  [440,300],[null,100],[330,150],[392,300],[523,150],[587,300],[440,300],
  [523,600]
];
let mIdx=0;

function startMusic(){
  if(!G.mOn) return;
  try{aCtx=new(window.AudioContext||window.webkitAudioContext)();playMel();}catch(e){}
}
function togMusic(){
  G.mOn=!G.mOn;
  document.querySelectorAll('.mu').forEach(b=>b.textContent=G.mOn?'🔊':'🔇');
  if(G.mOn) startMusic();
  else{clearTimeout(mT);try{aCtx&&aCtx.close();}catch(e){}aCtx=null;}
}
function pNote(f,d){
  if(!aCtx||!G.mOn) return;
  try{
    const o=aCtx.createOscillator(),g=aCtx.createGain();
    // Add a subtle reverb effect with a second oscillator slightly detuned
    const o2=aCtx.createOscillator(),g2=aCtx.createGain();
    o.connect(g);g.connect(aCtx.destination);
    o2.connect(g2);g2.connect(aCtx.destination);
    o.type='triangle';o.frequency.value=f;
    o2.type='sine';o2.frequency.value=f*1.003; // slight detune for shimmer
    g.gain.setValueAtTime(.06,aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+d/1000);
    g2.gain.setValueAtTime(.025,aCtx.currentTime);
    g2.gain.exponentialRampToValueAtTime(.001,aCtx.currentTime+d/1000*1.5);
    o.start();o.stop(aCtx.currentTime+d/1000);
    o2.start();o2.stop(aCtx.currentTime+d/1000*1.5);
  }catch(e){}
}
function playMel(){
  if(!G.mOn||!aCtx) return;
  const[f,d]=MEL[mIdx%MEL.length];
  if(f) pNote(f,d);
  mIdx++;
  mT=setTimeout(playMel,d+20);
}
function playSnd(t){
  if(!aCtx||!G.mOn) return;
  if(t==='ok')[784,988,1175].forEach((f,i)=>setTimeout(()=>pNote(f,150),i*100));
  else[440,370,330].forEach((f,i)=>setTimeout(()=>pNote(f,120),i*70));
}

//  LEADERBOARD — Firebase Firestore
// ══════════════════════════════════════════════
const HP_COL='hp_leaderboard';

async function saveScore(){
  if(!G.name) return;
  const chapDone=G.done.filter(Boolean).length;
  const entry={name:G.name,score:G.totSc,chap:chapDone,date:new Date().toLocaleDateString('th-TH'),ts:Date.now()};
  const lsKey='hp_math_lb';
  try{
    const m=JSON.parse(localStorage.getItem(lsKey)||'{}');
    if(!m[G.name]||m[G.name].score<G.totSc) m[G.name]=entry;
    localStorage.setItem(lsKey,JSON.stringify(m));
  }catch(_){}
  if(typeof db!=='undefined'&&db){
    try{
      const ref=db.collection(HP_COL).doc(G.name);
      const snap=await ref.get();
      if(!snap.exists||snap.data().score<G.totSc) await ref.set(entry);
    }catch(err){}
  }
}

async function loadLB(){
  const el=document.getElementById('lbList');
  el.innerHTML='<div class="lb-empty">กำลังโหลด Ranking... ⏳</div>';
  let entries=[];
  const lsKey='hp_math_lb';
  let lsEntries={};
  try{lsEntries=JSON.parse(localStorage.getItem(lsKey)||'{}');}catch(_){}
  if(typeof db!=='undefined'&&db){
    try{
      const snap=await db.collection(HP_COL).orderBy('score','desc').limit(20).get();
      if(!snap.empty){snap.forEach(doc=>entries.push(doc.data()));}
      else{entries=Object.values(lsEntries);}
    }catch(err){entries=Object.values(lsEntries);}
  } else {
    entries=Object.values(lsEntries);
  }
  entries.sort((a,b)=>b.score-a.score);
  if(!entries.length){
    el.innerHTML='<div class="lb-empty">🪄 ยังไม่มีข้อมูล Ranking<br><small>เล่นจนจบปีแรกแล้วมาดูอีกครั้ง!</small></div>';
    return;
  }
  const medals=['🥇','🥈','🥉'];
  const chIco=['🦉','🚂','🏰','🕸️','🐾','🏆','⚡'];
  el.innerHTML=entries.map((e,i)=>{
    const me=e.name===G.name;
    const prog=e.chap>0?`<span style="color:#aaa;font-size:.7rem;margin-left:4px;">${chIco.slice(0,e.chap).join('')}</span>`:'';
    return `<div class="lb-row${me?' me':''}">
      <div class="lb-rank">${medals[i]||'#'+(i+1)}</div>
      <div class="lb-name">${me?'👤 ':''}${e.name}${prog}</div>
      <div class="lb-sc">⭐ ${e.score}</div>
      <div class="lb-dt">${e.date||''}</div>
    </div>`;
  }).join('');
}

    sc.appendChild(s);
  }

  const lnPos=[[10,20],[85,40],[50,10],[30,70],[70,15]];
  lnPos.forEach(([l,t],i)=>{
    const ln=document.createElement('div');ln.className='lightning';
    ln.textContent='⚡';ln.style.cssText=`left:${l}%;top:${t}%;animation-delay:${i*1.3}s;`;

  });

    if(document.getElementById('sg').classList.contains('on')) setTimeout(initCV,150);

    if(e.key==='Enter') startGame();
  });
  // Save info on name input
  document.getElementById('inp').addEventListener('input',onNameInput);
  show('sw');
})();
